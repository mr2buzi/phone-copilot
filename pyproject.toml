[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phone-copilot"
version = "0.1.0"
description = "Supervised Android assistant with reply drafting, retrieval, policy gates and execution traces"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Phone Copilot Contributors"}]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "Jinja2>=3.1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "aiofiles>=23.0",
    "python-multipart>=0.0.6",
    "pytesseract>=0.3.10",
    "pillow>=10.0",
    "opencv-python>=4.8.0",
    "sqlalchemy>=2.0",
    "sqlmodel>=0.0.14",
    "structlog>=23.0",
    "python-dateutil>=2.8",
    "httpx>=0.27.0",
]

[project.urls]
Repository = "https://github.com/mr2buzi/phone-copilot"

[project.scripts]
phone-copilot-demo = "apps.demo.main:run"

[project.optional-dependencies]
vector = ["chromadb>=0.5.0", "sentence-transformers>=3.0.0"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "libs*"]

[tool.setuptools.package-data]
"apps.demo" = ["static/*.html", "static/*.css", "static/*.js"]
"apps" = ["desktop_ui/*.html", "desktop_ui/*.css", "desktop_ui/*.js"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
